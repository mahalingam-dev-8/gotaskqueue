name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_API: gotaskqueue-api
  ECR_REPOSITORY_WORKER: gotaskqueue-worker
  ECS_CLUSTER: gotaskqueue
  ECS_SERVICE_API: gotaskqueue-api
  ECS_SERVICE_WORKER: gotaskqueue-worker

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  push:
    name: build & push images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # OIDC: GitHub mints a short-lived token that AWS trusts, so there are no
    # long-lived AWS keys in repo secrets. id-token: write is what enables it.
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    strategy:
      matrix:
        include:
          - service: api
            repository_var: ECR_REPOSITORY_API
          - service: worker
            repository_var: ECR_REPOSITORY_WORKER
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env[matrix.repository_var] }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env[matrix.repository_var] }}:latest
          # Cache layers in the GitHub Actions cache so repeat builds are fast.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy to ECS Fargate
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Pull the live task definition, swap only the image, register the new
      # revision. Beats keeping a task-definition.json in the repo in sync by hand.
      - name: Render API task definition
        id: api-taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE_API }} \
            --query taskDefinition > api-taskdef.json
          echo "path=api-taskdef.json" >> "$GITHUB_OUTPUT"

      - name: Update API image
        id: api-render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.api-taskdef.outputs.path }}
          container-name: api
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ needs.push.outputs.image_tag }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Blocks until ECS reports the deployment stable, so a failing rollout
          # fails the workflow instead of going unnoticed.
          wait-for-service-stability: true

      - name: Render worker task definition
        id: worker-taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE_WORKER }} \
            --query taskDefinition > worker-taskdef.json
          echo "path=worker-taskdef.json" >> "$GITHUB_OUTPUT"

      - name: Update worker image
        id: worker-render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.worker-taskdef.outputs.path }}
          container-name: worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WORKER }}:${{ needs.push.outputs.image_tag }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_WORKER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
